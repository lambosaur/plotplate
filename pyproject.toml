[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotplate"
version = "0.4.0"
requires-python = ">=3.12"
description = "Multi-panel paper figures: matplotlib panels sized to a layout, assembled in LaTeX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lambert Moyon" }]
keywords = ["matplotlib", "figures", "publishing", "latex", "layout"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
# pymupdf is required: preview, check and export compose and inspect panel PDFs.
dependencies = ["matplotlib>=3.8", "numpy", "pyyaml", "pymupdf"]

[project.optional-dependencies]
seaborn = ["seaborn"]
marsilea = ["marsilea"]
# Everything `plotplate demo --build` needs on top of the core.
demo = ["numpy>=2", "pandas", "pyarrow", "scipy", "seaborn"]
# What the test suite needs on top of the core (used by tox and by the CI matrix).
test = ["pytest", "numpy>=2", "pandas", "pyarrow", "scipy", "seaborn"]

[project.urls]
Repository = "https://github.com/lambosaur/plotplate"
Documentation = "https://github.com/lambosaur/plotplate#readme"
Changelog = "https://github.com/lambosaur/plotplate/blob/HEAD/CHANGELOG.md"

[project.scripts]
plotplate = "plotplate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Everything that is not Python but has to travel with the package: the journal presets, the
# agent skills, and the demo. Recursive patterns, because naming folders here means the data
# silently stops shipping when one is renamed (which is how the demo's layout.yaml went missing).
# `tests/test_packaging.py` builds a wheel and checks that nothing under src/plotplate is left out.
[tool.setuptools.package-data]
plotplate = [
  "presets/**/*.yaml",
  "skills/**/*.md",
  "demo/**/*.md",
  "demo/**/*.py",
  "demo/**/*.yaml",
  "demo/**/*.csv",
  "demo/**/*.parquet",
  "demo/**/*.pdf",
  "demo/**/*.png",
  "demo/**/*.tex",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 102
indent-width = 4
extend-exclude = ["**/*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
extend-select = [
  "D",
  "E",
  "W",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "ANN",
  "RUF",
  "SIM",
  "C90",
]
# ANN401: matplotlib/seaborn objects are largely untyped; Any is the honest annotation.
ignore = ["E201", "E202", "E211", "E203", "ANN401"]
fixable = ["ALL"]
unfixable = ["F401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
# Panel notebooks end cells with a bare expression on purpose (notebook display).
"src/plotplate/demo/**" = ["D", "ANN", "B018"]
"scripts/**" = ["D103"]
# cmd_* handlers are documented by their argparse help text.
"src/plotplate/cli.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
exclude = ["^build/", "^\\.demo/", "^\\.pixi/", "^examples/", "^\\.tox/"]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
