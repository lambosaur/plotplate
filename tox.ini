# Compatibility runs across Python versions, outside pixi's single locked version.
# Locally:  pixi run -e dev tox            (the interpreters you have installed)
# In CI:    one job per version, see .github/workflows/ci.yml
[tox]
envlist = py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the test suite against {envname}
extras = test
passenv = MPLBACKEND
setenv = MPLBACKEND = Agg
commands = pytest -q {posargs}
