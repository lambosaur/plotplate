  formats: [pdf, eps, tiff]  # assumed
  raster_dpi: 300
notes:
  - Reported - width at most 84 mm (single) or 178 mm (double) column, height at most 230 mm.
  - Reported - plain sans-serif lettering, internally consistent, not smaller than 5 pt at final size.
