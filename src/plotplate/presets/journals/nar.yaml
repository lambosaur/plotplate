name: Nucleic Acids Research
description: Oxford University Press, NAR (NAR Cancer and NAR Genomics and Bioinformatics likely similar).
applies_to: [Nucleic Acids Research]
sources:
  - https://academic.oup.com/nar/pages/general_instructions
  - https://academic.oup.com/nar/pages/author-guidelines
verified: >-
  2026-09-14, NOT verified from the journal text. academic.oup.com blocks tools, and archived
  copies contain no figure section. Values come from search-engine excerpts; confirm before submission.
page:
  widths: {single: 84, double: 178}
  max_height: 230
style:
