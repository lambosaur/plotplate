name: PLOS
description: PLOS journals share one figure specification.
applies_to: [PLOS Genetics, PLOS Computational Biology, PLOS Biology (check), PLOS ONE (check)]
sources:
  - https://journals.plos.org/plosgenetics/s/figures
  - https://journals.plos.org/ploscompbiol/s/figures
verified: 2026-09-14, read directly from the official pages (PLOS Genetics and PLOS Computational Biology are identical)
page:
  widths: {min: 66.8, column: 132, full: 190.5}
  max_height: 222.3
style:
  font: {family: [Arial, Liberation Sans], size: 8, small: 8, large: 9, min: 8, max: 12}
  panel_label: {size: 10, weight: bold, case: upper}
  export: {dpi: 600}
deliverable:
  composite: true  # all panels in a single page and single file
  formats: [tiff, eps]  # TIFF or EPS only; LaTeX-generated EPS is not accepted
  raster_dpi: 600
notes:
  - Width 2.63-7.5 in (6.68-19.05 cm); height at most 8.75 in (22.23 cm); align with the text column at 5.2 in (13.2 cm) or less.
  - Arial, Times or Symbol font only, 8-12 point.
  - TIFF (LZW compression, RGB 8 bit, 300-600 dpi) or EPS; maximum 10 MB.
  - Multi-panel figures in a single file; panel labels such as (A) or (a) are used in the caption.
  - PLOS does not accept EPS generated by LaTeX; export the composite TIFF with `plotplate export`.
