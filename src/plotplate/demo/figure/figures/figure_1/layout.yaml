# The maintained layout of figure 1: Nature double column, A4 manuscript. Synthetic data only.
# Variants of this figure live next to it as layout.<variant>.yaml (see docs/layout.md):
#   layout.detected.yaml   what `plotplate detect` read from legacy/manuscript.pdf
#   layout.optimized.yaml  what `plotplate optimize` made of that draft
# `plotplate view .` shows all of them, and lets you lay one over another.
schema: 1
name: figure_1
journal: nature
output_dir: output  # everything a build writes goes here, and nothing else does
gutter: 4  # millimetres between panels: used to compute the boxes, and held by the optimizer
style_files: [../../style.yaml]
# The sheet this figure is meant for; `plotplate check` checks that it fits.
# Nature-like margins: the text block is then exactly the 183 mm double-column width.
page: {paper: a4, margins: {left: 13.5, right: 13.5, top: 25, bottom: 25}, caption: 25}
# The figure's own box: everything below is in millimetres from its top-left corner.
area:
  width: double  # 183 mm from the journal preset
  height: 150
# Named alignment lines (page mm). Axes in different panels referencing the same guide
# line up exactly once LaTeX places the panels next to each other.
guides:
  x:
    left_axis: 11  # left spine of A/roc, C/scatter, D/main
    right_axis: 181  # right spine of C/scatter, E/main
  y:
    row1_bottom: 45  # bottom spine of A/roc, A/prc and B heatmap
    row3_bottom: 140  # bottom spine of D/main and E/main
mosaic:
  rows: [AB, CC, DE]
  heights: [55, 42, 45]
panels:
  A:  # ROC + PRC side by side: one panel, two axes
    axes:
      roc: {left: left_axis, top: 5, right: 44, bottom: row1_bottom}
      prc: {left: 55, top: 5, right: 88, bottom: row1_bottom}
  B:  # seaborn clustermap, heatmap edges pinned
    axes:
      heatmap: {left: 110, top: 11, right: 158, bottom: row1_bottom}
      cbar: {box: [97, 4, 1.8, 7]}
  C:  # series of four scatterplots sharing one axes grid
    axes:
      scatter: {left: left_axis, top: 64, right: right_axis, bottom: 94, ncols: 4, wgap: 9}
  D:
    axes:
      main: {left: left_axis, top: 109, right: 88, bottom: row3_bottom}
  E:
    axes:
      main: {left: 105, top: 109, right: right_axis, bottom: row3_bottom}
