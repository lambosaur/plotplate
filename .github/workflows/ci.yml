name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
      - run: pixi run -e dev ruff check .
      - run: pixi run -e dev ruff format --check .
      - run: pixi run -e dev mypy .
      # snapper's pre-commit hook assumes it is already on PATH (see
      # project-meta/docs/tooling.md); a CI runner is stateless, so this
      # install is unconditional here, unlike make check-snapper's local report-only check.
      - run: pixi global install snapper-fmt
      - run: pixi run -e dev pre-commit run --all-files --hook-stage manual

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
      - run: pixi run -e dev pytest

  python-version-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Deliberately not pixi.lock here; that pins one Python version.
      # tox installs the package with its [test] extra and runs the suite, so this
      # verifies requires-python's whole declared range really works.
      - run: pip install tox
      - run: tox -e py
