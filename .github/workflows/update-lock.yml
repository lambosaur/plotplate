name: Update pixi.lock

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
      - run: pixi update
      - run: pixi run -e dev pytest
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-pixi-lock
          title: "Update pixi.lock"
          commit-message: "Update pixi.lock"
          add-paths: pixi.lock
